# TLS termination blueprint. Replace swing.example.com and supply certificate files
# through the read-only /run/tls mount. Never put private key material in this repo.
server {
    listen 443 ssl http2;
    server_name swing.example.com;

    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/twin.conf;
    include /etc/nginx/agent.conf;
}

server {
    listen 80;
    server_name swing.example.com;
    return 301 https://$host$request_uri;
}
