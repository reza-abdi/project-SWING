[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["modules", "scripts", "tests"]
exclude = [".venv", "node_modules", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
target-version = ["py312"]
line-length = 120
