[project]
name = "project-swing"
version = "0.0.0"
description = "Project SWING simulation and decision-support system"
requires-python = ">=3.12,<3.13"

# The supplied SAC policy metadata records training under Python 3.10.20.
# Real policy inference compatibility is checked after trusted artifacts and dependencies are restored.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["modules", "scripts", "tests"]
exclude = [".venv", "node_modules", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
target-version = ["py312"]
line-length = 120
